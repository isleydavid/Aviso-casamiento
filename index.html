
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David & Mariana | Casamiento en Brasil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
          --color-bg: #fdfcf9;
          --color-text-main: #1a1a1a;
          --color-text-muted: #555555;
          --color-text-light: #777777;
          --color-gold: #b89c72;
          --color-border: rgba(0, 0, 0, 0.12);
          --color-card: #ffffff;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text-main);
            scroll-behavior: smooth;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, .serif {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
        }
        .italic-serif {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
        }
        .tracking-widest-extra {
            letter-spacing: 0.5em;
        }
        .reveal-mask {
            display: inline-block;
            overflow: hidden;
            vertical-align: bottom;
        }
        ::selection {
            background: var(--color-gold);
            color: #fff;
        }
        ::-webkit-scrollbar {
          width: 4px;
        }
        ::-webkit-scrollbar-track {
          background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
          background: var(--color-gold);
        }
        .info-card {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            box-shadow: 0 10px 40px -20px rgba(0,0,0,0.08);
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1), box-shadow 0.4s ease;
        }
        .info-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 30px 60px -30px rgba(184, 156, 114, 0.15);
        }
        .gold-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--color-gold), transparent);
            width: 100%;
        }
    </style>
